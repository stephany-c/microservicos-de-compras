server:
  port: 8086

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5438/inventory_db
    username: inventory_admin
    password: inventory_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: http://localhost:4566
